pythonJob:
  enabled: false
  name: "python-job"
  scriptContent: ""
  requirementsContent: ""
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  restartPolicy: Never
  image:
    repository: jupyter/all-spark-notebook
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 1.0
      memory: 3Gi
    requests:
      cpu: 0.25
      memory: 1Gi
