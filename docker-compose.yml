# Local PostgreSQL for pipeline development.
#
# The workshop supplies every source as a flat file, but the target
# architecture requires PostgreSQL to be a genuine source system feeding the
# bronze layer. This container provides that database locally; the pipeline
# seeds it once from the raw exports and reads from it over JDBC thereafter.
#
# Start:   docker compose up -d
# Stop:    docker compose down
# Wipe:    docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: acme-pipeline-postgres
    environment:
      POSTGRES_DB: acme
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: